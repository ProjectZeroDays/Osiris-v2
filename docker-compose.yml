name: osiris
services:
  osiris:
    # Builds locally from the Dockerfile so you always run the cloned code.
    # To use the prebuilt image instead, replace the `build:` block below with
    # `image: ghcr.io/simplifaisoul/osiris:latest`.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osiris
    # Host port is configurable via OSIRIS_PORT in .env (defaults to 3000).
    ports:
      - "${OSIRIS_PORT:-3000}:3000"
    # Optional API keys / scanner backend — copy .env.template to .env and
    # fill in what you need. Missing file is ignored (keyless feeds still work).
    env_file:
      - path: .env
        required: false
    environment:
      # CSP / security headers are handled by the app; no extra env needed.
      # If running behind a proxy, mirror CSP / X-Content-Type-Options / HSTS.
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # The durable record for findings, audit, quotas and the asset
      # registry. Empty by default: without it the platform runs
      # single-tenant and keeps the record in memory. The `db` profile
      # below fills it in.
      - DATABASE_URL=${DATABASE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Readiness, not liveness. `/api/health` says the process is up;
    # `/api/ready` says whether it can serve — the database is reachable
    # and has its tables, there is an account to sign in as, and the
    # tool-collection worker answers. A container that is up and useless
    # is a container a restart policy should know about.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/ready').then(r=>{process.exitCode=r.ok?0:1}).catch(()=>{process.exitCode=1})"
      interval: 30s
      timeout: 10s
      retries: 3
      # The first start compiles and migrates; a slow start is not a
      # failure.
      start_period: 60s
    restart: unless-stopped
    networks:
      - default
      - umami_default

  # ── Postgres (opt-in: `docker compose --profile db up -d`) ──────────────
  # The platform works without a database. With one, findings, audit
  # entries, quota counters, the asset registry and consent records all
  # survive a restart and are shared between replicas.
  #
  # A database also means the platform demands a session, and a platform
  # with no accounts has none. Visit it after starting the `db` profile
  # and the first-run screen creates the first tenant and administrator
  # and signs it in. The route is closed behind the first account.
  osiris-db:
    image: postgres:16-alpine
    container_name: osiris-db
    profiles: ["db"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-osiris}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-osiris}
      - POSTGRES_DB=${POSTGRES_DB:-osiris}
    volumes:
      - osiris-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-osiris} -d ${POSTGRES_DB:-osiris}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default

  osiris-cache:
    image: nginx:alpine
    container_name: osiris-cache
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - osiris
    restart: unless-stopped
    networks:
      - default

  # ── The tool-collection worker ───────────────────────────────────────────
  # The wide Cyber-Security tool collection. It imports tool modules and
  # runs some of them as subprocesses, so it is not a surface a client may
  # reach: the platform's dispatcher is the only thing that talks to it,
  # and it says so with a shared secret. The worker answers nothing but
  # its health check without that secret.
  #
  # The port is not published. The platform reaches it over the compose
  # network, which is the only place it should be reachable from.
  osiris-intel:
    build:
      context: ./intel
      dockerfile: Dockerfile
    container_name: osiris-intel
    environment:
      - OSIRIS_WORKER_KEY=${OSIRIS_WORKER_KEY:-}
      - OSIRIS_WORKER_HOST=0.0.0.0
      - OSIRIS_WORKER_PORT=8080
    restart: unless-stopped
    networks:
      - default

volumes:
  nginx-cache:
  osiris-db-data:

networks:
  umami_default:
    external: true

# ── CasaOS app-store metadata (ignored by plain Docker Compose) ──
x-casaos:
  architectures:
    - amd64
    - arm64
  main: osiris
  author: simplifaisoul
  developer: simplifaisoul
  category: Network
  description:
    en_us: >-
      OSIRIS is a production-grade open-source OSINT situational-awareness
      dashboard. It aggregates real-time global intelligence across aviation,
      maritime, CCTV networks, seismic activity, wildfires, news feeds,
      weather, space weather, cyber threats (CVEs) and conflict zones into a
      single GPU-accelerated MapLibre interface. Most features work with no
      API keys.
  tagline:
    en_us: Real-time global OSINT intelligence dashboard
  title:
    en_us: OSIRIS
  icon: https://raw.githubusercontent.com/simplifaisoul/osiris/master/public/casaos-icon.png
  thumbnail: https://raw.githubusercontent.com/simplifaisoul/osiris/master/public/og-image.png
  screenshot_link:
    - https://raw.githubusercontent.com/simplifaisoul/osiris/master/public/og-image.png
  scheme: http
  hostname: ""
  port_map: "3000"
  index: /
  webui_port: 3000
  envs:
    - container: SCANNER_URL
      description:
        en_us: "(Optional) RECON scanner backend URL, e.g. http://scanner:7700"
    - container: SCANNER_KEY
      description:
        en_us: "(Optional) RECON scanner shared secret (must match backend OSIRIS_KEY)."
    - container: FIRMS_API_KEY
      description:
        en_us: "(Optional) NASA FIRMS API key for active-fire data."
    - container: AIS_API_KEY
      description:
        en_us: "(Optional) aisstream.io key for maritime vessel tracking."
    - container: OPENSKY_CLIENT_ID
      description:
        en_us: "(Optional) OpenSky OAuth2 client id for higher aircraft rate limits."
    - container: OPENSKY_CLIENT_SECRET
      description:
        en_us: "(Optional) OpenSky OAuth2 client secret."
    - container: N2YO_API_KEY
      description:
        en_us: "(Optional) N2YO key for satellite tracking."
  ports:
    - container: "3000"
      description:
        en_us: "Web UI (HTTP)."
